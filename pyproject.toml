[project]
name = "trading-x"
version = "0.1.0"
description = "AI 龙头选股系统 V1"
requires-python = ">=3.11"
dependencies = [
    "tushare>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_x"]

[dependency-groups]
dev = [
    "jsonschema>=4.0",
    "pyright>=1.1.411",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
